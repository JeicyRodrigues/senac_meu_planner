<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Livros Lidos - Capítulo 1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --marrom: #633535;
            --vinho: #8b4361;
            --rosa: #faeeeb;
            --borda: #b89794;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background-image: url('imagens/backgroud.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--marrom);
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px 6px;
        }

        .logo-link img { width: 250px; transition: 0.3s; }
        .logo-link:hover img { transform: scale(1.05); }

        .header-titulo {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo-linha {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .arabesco { height: 54px; }
        .arabesco-dir { transform: scaleX(-1); }

        .titulo-pagina {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
        }

        .subtitulo-header {
            font-family: 'Dancing Script', cursive;
            font-size: 1.2rem;
            color: var(--vinho);
        }

        .btn-drawer { background: none; border: none; cursor: pointer; }
        .btn-drawer img { width: 52px; }

        .drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); }
        .drawer-overlay.aberto { display:block; }

        .drawer {
            position:fixed; top:0; right:-320px;
            width:300px; height:100vh;
            background:#faeeeb;
            transition:0.3s;
        }
        .drawer.aberto { right:0; }

        .container-biblioteca {
            background-color: rgba(250, 238, 235, 0.72);
            width: 92%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 18px;
            flex: 1;
        }

        .contador-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .livros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
        }

        .livro-card {
            text-align: center;
            cursor: pointer;
        }

        .capa-wrapper {
            width: 125px;
            height: 185px;
            margin: auto;
            position: relative;
        }

        .capa-sombra {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .capa-placeholder {
            width: 100%;
            height: 100%;
            background: #e0d0cc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            border-radius: 8px;
        }

        .btn-lixeira {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--vinho);
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }

        .livro-titulo { font-size: 0.8rem; font-weight: bold; }
        .livro-autor { font-size: 0.7rem; color: #777; }

        .estado-vazio { text-align: center; }

        footer { text-align: center; padding: 20px; }
    </style>
</head>

<body>

<div class="container-biblioteca">

    <div id="estadoVazio" class="estado-vazio" style="display:none;">
        <h2>Sua biblioteca está vazia 📚</h2>
        <a href="Registro.html">Adicionar livro</a>
    </div>

    <div id="contadorBar" class="contador-bar" style="display:none;">
        <span>Você leu <strong id="totalLivros">0</strong> livros</span>
    </div>

    <div class="livros-grid" id="livrosGrid"></div>

</div>

<footer>Capítulo 1 © 2026</footer>

<script>
const DB_KEY = 'livros_lidos';

function renderBiblioteca() {
    const grid = document.getElementById('livrosGrid');
    const livros = JSON.parse(localStorage.getItem(DB_KEY) || '[]');

    grid.innerHTML = '';

    document.getElementById('estadoVazio').style.display = livros.length === 0 ? 'block' : 'none';
    document.getElementById('contadorBar').style.display = livros.length === 0 ? 'none' : 'flex';

    if (livros.length > 0) {
        document.getElementById('totalLivros').textContent = livros.length;

        [...livros].reverse().forEach(livro => {

            const card = document.createElement('div');
            card.className = 'livro-card';

            const capa = livro.imagem_url
                ? `<img src="${livro.imagem_url}" class="capa-sombra">`
                : `<div class="capa-placeholder">📚</div>`;

            card.innerHTML = `
                <div class="capa-wrapper">
                    ${capa}
                    <button class="btn-lixeira">🗑️</button>
                </div>
                <div class="livro-titulo">${livro.titulo}</div>
                <div class="livro-autor">${livro.autor || ''}</div>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-lixeira')) {
                    if (confirm('Excluir livro?')) {
                        const novos = livros.filter(l => l.id !== livro.id);
                        localStorage.setItem(DB_KEY, JSON.stringify(novos));
                        renderBiblioteca();
                    }
                }
            });

            grid.appendChild(card);
        });
    }
}

renderBiblioteca();
</script>

</body>
</html>
